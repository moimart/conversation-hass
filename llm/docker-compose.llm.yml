# vLLM backend for PAL + OpenClaw (project "pal-llm").
#
# NOT started by hand: the pal-llm-control container (llm-control/) brings
# this service up when the HA "LLM Backend" select switches to vllm, and
# stops it when it switches back to ollama (Ollama's big models are unloaded
# while vLLM runs, so the two never compete for VRAM).
#
# The tunables live in llm/llm.env (passed as `--env-file`, which is what
# compose interpolates into `command:`), rewritten by llm-control from the HA
# entities ("LLM Context Size", "LLM Concurrency"); llm.env.example documents
# every key. vLLM fixes context length and concurrency at startup, so changing
# them restarts this container.
#
# Works with Docker or Podman (compose against the engine's API socket).

name: pal-llm

services:
  vllm:
    image: vllm/vllm-openai:v0.32.0
    container_name: pal-vllm
    restart: "no"            # lifecycle owned by llm-control
    ipc: host                # vLLM uses shared memory between workers
    ports:
      - "8000:8000"          # OpenClaw (host process) uses 127.0.0.1:8000
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ${PAL_LLM_HF_CACHE:-/home/moimart/ai_storage/huggingface}:/root/.cache/huggingface
    command:
      - --model=${VLLM_MODEL:-Qwen/Qwen3.8-27B-FP8}
      - --served-model-name=${VLLM_SERVED_NAME:-qwen3.8-27b}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-131072}
      - --max-num-seqs=${VLLM_MAX_NUM_SEQS:-4}
      - --gpu-memory-utilization=${VLLM_GPU_MEM_UTIL:-0.55}
      - --enable-auto-tool-choice
      - --tool-call-parser=${VLLM_TOOL_PARSER:-qwen3_xml}
      - --reasoning-parser=qwen3
      - --enable-prefix-caching
      - --host=0.0.0.0
      - --port=8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 900s     # first start downloads ~28 GB of weights
